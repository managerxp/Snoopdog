# SnoopDog site config for a native nginx (no containers): serves the pre-rendered static site. There is no
# backend. Releases live in /var/www/snoopdog/releases/<time>, and /var/www/snoopdog/current points at the live one
# (see deploy/release.sh), so a deploy is one symlink flip and a rollback is flipping it back.
#
# Before installing, replace YOUR_DOMAIN with the real domain:
#   sed 's/YOUR_DOMAIN/example.com/g' deploy/nginx.conf | sudo tee /etc/nginx/sites-available/snoopdog >/dev/null
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/snoopdog-security-headers.conf
#   sudo ln -s /etc/nginx/sites-available/snoopdog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com      # TLS; see DEPLOY.md

server {
  listen 80;
  server_name www.YOUR_DOMAIN;
  return 301 https://YOUR_DOMAIN$request_uri;
}

server {
  listen 80;
  server_name YOUR_DOMAIN;
  root /var/www/snoopdog/current;
  index index.html;
  server_tokens off;

  # Security headers live in one snippet. It is included here for the locations that set no header of their
  # own, and again inside every location that does, because nginx drops inherited add_header lines in any
  # location with its own.
  include /etc/nginx/snippets/snoopdog-security-headers.conf;

  # hashed build files never change: cache them hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri =404;
  }
  location /static-loader-data/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri =404;
  }

  # images keep their names when replaced, so a week, not a year
  location /images/ {
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri =404;
  }

  # robots and sitemap change with the site, so they are re-checked
  location = /robots.txt {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri =404;
  }

  # /delivery/ -> /delivery (the pages are delivery.html, contact.html, ...)
  rewrite ^/(.+)/$ /$1 permanent;
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
  }

  # pages: always re-checked, so a new release shows at once
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/snoopdog-security-headers.conf;
    try_files $uri $uri.html $uri/index.html =404;   # "/" -> /index.html, "/faq" -> /faq.html
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
