# SnoopDog security headers, included by deploy/nginx.conf in the server block AND in every location that
# sets its own add_header (nginx drops inherited add_header lines in any location that has one).
#
# Install next to the site config:
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/snoopdog-security-headers.conf
#
# Content-Security-Policy, line by line:
#   default-src 'self'                  anything not listed below comes only from the site itself
#   script-src 'self' 'unsafe-inline'   the site's own bundle, plus the two small inline scripts the pre-renderer writes into
#                                       every page (router hydration data and a per-build hash; the hash changes on every
#                                       build, so it cannot be pinned). No third-party scripts. The JSON-LD block is data.
#   style-src 'self' 'unsafe-inline'    the built stylesheet, plus style attributes React sets
#   img-src 'self' data:                every image is on this site
#   font-src 'self'                     Gabarito and Figtree are self-hosted
#   connect-src 'self'                  the pre-rendered pages fetch their own small JSON files
#   object-src 'none', base-uri 'self', form-action 'none' (no forms), frame-ancestors 'none' (cannot be framed)
# If the browser console shows "Refused to ... Content Security Policy", add that source to the matching line.
# Ceiling: 'unsafe-inline' for scripts is acceptable only while the site has no user input. If a form or comments
# are ever added, switch to nonces or hashes first.
#
# Strict-Transport-Security takes effect once HTTPS is on (certbot, see DEPLOY.md).

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
