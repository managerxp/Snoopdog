<!doctype html>
<html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google-site-verification" content="1aGPBg_iZoGnmQeq2vlAgTrEYtNkBKSu5NKnHCDS5WU">
    <meta name="theme-color" content="#06142A" />
    <meta name="color-scheme" content="light dark" />
    <script>try{var t=localStorage.getItem("sd-theme");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.dataset.theme=t;var m=document.querySelector("meta[name=theme-color]");if(m)m.content=t==="dark"?"#06142A":"#E3EEF9"}catch(e){}</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <noscript><style>[style*="opacity: 0"],[style*="opacity:0"]{opacity:1!important;transform:none!important;filter:none!important}</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
